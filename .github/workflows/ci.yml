name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly restore drill and full run, even without code changes.
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://mynx:mynx_ci@localhost:5432/mynx_test?schema=public
  REDIS_URL: redis://localhost:6379/1
  CORS_ORIGINS: http://localhost:5173
  SESSION_SECRET: ci-only-session-secret-that-is-long-enough-000
  QUEUE_PREFIX: mynx-ci
  ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
  ENABLE_QUEUES: 'false'
  RATE_LIMIT_MAX: '100000'
  AUTH_RATE_LIMIT_MAX: '100000'
  HEAVY_RATE_LIMIT_MAX: '100000'
  STORAGE_LOCAL_DIR: /tmp/mynx-storage

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mynx
          POSTGRES_PASSWORD: mynx_ci
          POSTGRES_DB: mynx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mynx" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Apply migrations (verifies they run from scratch)
        working-directory: server
        run: npx prisma migrate deploy
      - name: Verify schema and migrations are in sync
        working-directory: server
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Server tests with coverage thresholds
        run: npm run test:coverage --workspace server
      - name: Client tests
        run: npm test --workspace client
      - run: npm run build
      - name: Performance smoke (p95 budget)
        working-directory: server
        run: node scripts/perf-smoke.js
      - name: Install PostgreSQL 17 client tools for the restore drill
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Backup and restore drill (encrypted dump → restore → ledger checks)
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          BACKUP_ENCRYPTION_KEY: H39BF4haUxgYoRWT/QDNrHXQNl6QitU1jdVTW/iD3Ps=
        run: npm run backup:drill
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high --omit=dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-drill
          path: |
            server/coverage/
            .devdata/drills/*-report.json

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mynx
          POSTGRES_PASSWORD: mynx_ci
          POSTGRES_DB: mynx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mynx" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests (desktop and mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/server.Dockerfile
          push: false
          tags: mynx-api:ci
      - name: Build web image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/client.Dockerfile
          push: false
          tags: mynx-web:ci
