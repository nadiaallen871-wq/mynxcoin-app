# Local / staging-like stack. Development credentials only: never reuse them in production.
#   docker compose up -d postgres redis          # dependencies only (run apps with npm)
#   docker compose --profile app up -d --build   # full stack behind Nginx on :8080
name: mynx

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mynx
      POSTGRES_PASSWORD: mynx_dev
      POSTGRES_DB: mynx_dev
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mynx -d mynx_dev']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: infrastructure/docker/server.Dockerfile }
    command: ['sh', '-c', 'npx prisma migrate deploy && node prisma/seed.js']
    env_file: [server/.env.docker]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    build: { context: ., dockerfile: infrastructure/docker/server.Dockerfile }
    env_file: [server/.env.docker]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/health']
      interval: 10s

  worker:
    profiles: [app]
    build: { context: ., dockerfile: infrastructure/docker/server.Dockerfile }
    command: ['node', 'src/worker.js']
    env_file: [server/.env.docker]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., dockerfile: infrastructure/docker/client.Dockerfile }
    ports: ['127.0.0.1:8080:8080']
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
